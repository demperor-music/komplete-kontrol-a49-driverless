name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build extension
        run: mvn -B -ntp clean package

      - name: Upload .bwextension
        uses: actions/upload-artifact@v7
        with:
          name: KompleteKontrolA49Driverless
          path: target/KompleteKontrolA49Driverless.bwextension
          if-no-files-found: error
