name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.parse.outputs.is_release }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse release commit title
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          title="$(git log -1 --pretty=%s)"
          echo "Head commit title: $title"
          if [[ "$title" =~ ^([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]+release:[[:space:]]*(.*)$ ]]; then
            version="${BASH_REMATCH[1]}"
            summary="${BASH_REMATCH[2]}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "summary=$summary" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: ${{ needs.detect.outputs.tag }}
      SUMMARY: ${{ needs.detect.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          pom_version="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$pom_version" != "$VERSION" ]]; then
            echo "::error::pom.xml version is $pom_version but the release commit says $VERSION"
            exit 1
          fi
          definition="src/main/java/dev/demperor/bitwig/a49/KompleteKontrolA49DriverlessExtensionDefinition.java"
          if ! grep -q "return \"$VERSION\";" "$definition"; then
            echo "::error::getVersion() in $definition does not contain $VERSION"
            exit 1
          fi

      - name: Build extension
        run: mvn -B -ntp clean package

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          test -f target/KompleteKontrolA49Driverless.bwextension
          mkdir -p release
          cp target/KompleteKontrolA49Driverless.bwextension release/
          cp README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md release/
          cp -R docs LICENSES release/
          (cd release && zip -r "../KompleteKontrolA49Driverless-${VERSION}.zip" .)

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SUMMARY" ]]; then
            title="v${VERSION} — ${SUMMARY}"
          else
            title="v${VERSION}"
          fi
          notes="${SUMMARY:-Release ${VERSION}}"
          notes+=$'\n\n'
          notes+="Built from commit ${GITHUB_SHA}."
          gh release create "$TAG" \
            "target/KompleteKontrolA49Driverless.bwextension#Bitwig extension" \
            "KompleteKontrolA49Driverless-${VERSION}.zip#Extension and documentation" \
            --title "$title" \
            --notes "$notes" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.detect.outputs.version }}
          path: |
            target/KompleteKontrolA49Driverless.bwextension
            KompleteKontrolA49Driverless-${{ needs.detect.outputs.version }}.zip
          if-no-files-found: error
