[package]
name = "a49-display-paint"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Paint tool for the Komplete Kontrol A49 OLED display"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
rfd = "0.15"
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
